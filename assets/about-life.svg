</style><rect width="100%" height="100%" rx="28" fill="#070b16"/><rect width="100%" height="100%" rx="28" fill="url(#dots)"/><rect x="1" y="1" width="998" height="568" rx="27" fill="none" stroke="url(#g-border)" stroke-opacity=".65"/><g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f4f6ff"><text x="42" y="54" font-size="14" letter-spacing="3" fill="#91a0bc">01 / ABOUT &amp; LIFE</text><text x="42" y="104" font-size="36" font-weight="800">Curious by default.</text><text x="42" y="139" font-size="36" font-weight="800" fill="#247bff">Building with intent.</text><text x="42" y="183" font-size="16" fill="#bac5da">Exploring the intersection of software, AI,</text><text x="42" y="208" font-size="16" fill="#bac5da">and thoughtful problem-solving.</text><rect x="42" y="242" width="430" height="205" rx="18" fill="#101a2b" stroke="#263754"/><text x="66" y="277" font-size="13" fill="#6ea7ff" letter-spacing="2">CAPABILITIES I’M EXPLORING</text><g font-size="15" fill="#e6ebf7"><circle cx="72" cy="311" r="4" fill="#247bff"/><text x="87" y="316">Software development &amp; problem-solving</text><circle cx="72" cy="348" r="4" fill="#ff354f"/><text x="87" y="353">AI, ML, GenAI &amp; data science</text><circle cx="72" cy="385" r="4" fill="#247bff"/><text x="87" y="390">Web experiences &amp; 3D interfaces</text><circle cx="72" cy="422" r="4" fill="#ff354f"/><text x="87" y="427">Learning through hands-on projects</text></g><rect x="520" y="84" width="430" height="363" rx="22" fill="#0d1424" stroke="url(#g-border)"/><text x="550" y="124" font-size="13" letter-spacing="2" fill="#91a0bc">OFF THE KEYBOARD</text><g style="animation:slide1 12s infinite"><rect x="550" y="151" width="370" height="210" rx="18" fill="#13213a"/><text x="578" y="207" font-size="30" font-weight="800">01</text><text x="578" y="252" font-size="25" font-weight="750" fill="#6ea7ff">Competitive</text><text x="578" y="282" font-size="25" font-weight="750" fill="#6ea7ff">programming</text><text x="578" y="325" font-size="14" fill="#c0cce1">Think clearly. Solve patiently.</text></g><g style="animation:slide2 12s infinite"><rect x="550" y="151" width="370" height="210" rx="18" fill="#21182a"/><text x="578" y="207" font-size="30" font-weight="800">02</text><text x="578" y="252" font-size="25" font-weight="750" fill="#ff7b91">Building</text><text x="578" y="282" font-size="25" font-weight="750" fill="#ff7b91">projects</text><text x="578" y="325" font-size="14" fill="#d7c8d9">Turn concepts into working things.</text></g><g style="animation:slide3 12s infinite"><rect x="550" y="151" width="370" height="210" rx="18" fill="#122620"/><text x="578" y="207" font-size="30" font-weight="800">03</text><text x="578" y="252" font-size="25" font-weight="750" fill="#78e0c0">Learning AI</text><text x="578" y="282" font-size="25" font-weight="750" fill="#78e0c0">and beyond</text><text x="578" y="325" font-size="14" fill="#c4dcd4">Stay curious. Keep experimenting.</text></g><g transform="translate(550 390)"><rect width="112" height="5" rx="2" fill="#247bff"/><rect x="122" width="112" height="5" rx="2" fill="#2c3950"/><rect x="244" width="112" height="5" rx="2" fill="#2c3950"/><rect width="112" height="5" rx="2" fill="#247bff" opacity=".85"><animate attributeName="width" values="0;112;0" keyTimes="0;.33;1" dur="4s" repeatCount="indefinite"/></rect></g><text x="42" y="500" font-size="13" fill="#71819e">INTERESTS CONFIRMED BY AVINASH</text><text x="42" y="532" font-size="16" fill="#dbe4f5">Competitive programming  /  Building projects  /  Learning AI</text></g></svg>