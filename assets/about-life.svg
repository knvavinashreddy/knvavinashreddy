<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-label="About Avinash and animated interests carousel"><title>About Avinash and animated interests carousel</title><defs><linearGradient id="g-border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff"/><stop offset="1" stop-color="#6ea7ff"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#62718e" opacity=".22"/></pattern><clipPath id="portrait-clip"><rect x="0" y="0" width="300" height="330" rx="24"/></clipPath></defs><style>
