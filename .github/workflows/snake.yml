name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: knvavinashreddy
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF69B4&color_dots=%23161B22,%23291C2C,%236F2D5C,%23D16CA5,%23FFB7D5
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF69B4&color_dots=%230B1117,%23291C2C,%236F2D5C,%23D16CA5,%23FFB7D5

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
